<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Polynomial MIDI</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
       <button id="fs-btn">⛶ Fullscreen</button>
    </main>
    <script src="sketch.js"></script>
    <script>
    document.getElementById('fs-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.getElementById('fs-btn').textContent = '✕ Exit';
      } else {
        document.exitFullscreen();
        document.getElementById('fs-btn').textContent = '⛶ Fullscreen';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement)
        document.getElementById('fs-btn').textContent = '⛶ Fullscreen';
    });
  </script>
  </body>
</html>
