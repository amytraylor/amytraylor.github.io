<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polynomial Explorer</title>

  <!-- Remove this if you are not actually using an external stylesheet -->
  <!-- <link rel="stylesheet" href="style.css" /> -->

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #e5e5e5;
      min-height: 100vh;
    }

    #fs-btn {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 1000;
      padding: 0.5rem 0.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #fs-btn:hover {
      background: #1d4ed8;
    }

    .nav {
      padding: 0.75rem 1.5rem;
      background: #2a2a2a;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav a {
      color: #999;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav a:hover {
      color: #60a5fa;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: calc(100vh - 50px);
    }

    .canvas-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #000;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .controls button {
      padding: 0.5rem 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #1d4ed8;
    }

    .info {
      padding: 1.5rem;
      border-left: 1px solid #333;
      overflow-y: auto;
    }

    .info h1 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .info p {
      margin: 0.75rem 0;
      line-height: 1.6;
      color: #ccc;
    }

    .info ul {
      margin: 0.75rem 0;
      padding-left: 1.25rem;
    }

    .info li {
      margin: 0.25rem 0;
      color: #ccc;
    }

    .info code {
      background: #2a2a2a;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }

    details {
      margin-top: 1.5rem;
    }

    summary {
      cursor: pointer;
      color: #60a5fa;
    }

    pre {
      margin-top: 0.5rem;
      background: #2a2a2a;
      padding: 1rem;
      overflow: auto;
      max-height: 300px;
      font-size: 0.8rem;
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .info {
        border-left: none;
        border-top: 1px solid #333;
      }
    }
  </style>
</head>
<body>
  <button id="fs-btn">⛶ Fullscreen</button>

  <nav class="nav">
    <a href="../">&larr; Back to Sketches</a>
    <span>Polynomial Explorer</span>
  </nav>

  <div class="container">
    <div class="canvas-area">
      <div id="canvas-container"></div>
      <div class="controls">
        <button id="save-btn">Save Image</button>
      </div>
    </div>

    <div class="info">
      <h1>Polynomial Explorer</h1>
      <p>Explore how polynomial curves behave.</p>

      <p><strong>Try this:</strong></p>
      <ul>
        <li>Use the indicated keys to control the sketch</li>
      </ul>

      <p>This sketch demonstrates:</p>
      <ul>
        <li>Polynomials</li>
      </ul>

      <details>
        <summary>View Code</summary>
        <pre id="code-display"></pre>
      </details>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="sketch.js"></script>

  <script>
    const fsBtn = document.getElementById("fs-btn");
    const saveBtn = document.getElementById("save-btn");

    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        fsBtn.textContent = "✕ Exit";
      } else {
        document.exitFullscreen();
        fsBtn.textContent = "⛶ Fullscreen";
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        fsBtn.textContent = "⛶ Fullscreen";
      }
    });

    // saveBtn.addEventListener("click", () => {
    //   if (typeof saveCanvas === "function") {
    //     saveCanvas("WhatDoesItDoPolynomials", "png");
    //   }
    // });

    fetch("sketch.js")
      .then(r => r.text())
      .then(code => {
        document.getElementById("code-display").textContent = code;
      })
      .catch(err => {
        document.getElementById("code-display").textContent =
          "Could not load sketch.js\n\n" + err;
      });
  </script>
</body>
</html>
